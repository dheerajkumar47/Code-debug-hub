search:
  # Each query runs against /projects/active. Keep them tight — quality over volume.
  queries: ["RAG", "chatbot", "AI agent", "LangChain", "LLM", "OpenAI", "WhatsApp bot",
            "computer vision", "YOLO", "FastAPI", "AI automation"]
  job_ids: []               # optional Freelancer skill IDs to narrow search
  project_types: [fixed, hourly]
  min_budget_usd: 30
  max_bid_count: 60
  max_age_hours: 24
  require_payment_verified: false   # true once you have reviews; false helps find first jobs
  min_client_rating: 0              # 0 = allow new clients
  blocked_countries: []
  allowed_currencies: []            # empty = all
  exclude_keywords: ["wordpress theme", "logo design", "data entry only", "homework", "assignment",
                     "exam", "thesis writing", "adult", "casino", "crypto pump"]
  skip_nda: true            # never auto-accept NDAs; review manually

style:
  min_words: 70
  max_words: 170
  max_chars: 1500           # Freelancer bid description limit
  signature: "Dheeraj"
  tone: "confident, plain English, specific, no fluff"
